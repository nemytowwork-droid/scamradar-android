name: Build ScamRadar Next APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScamRadar-Next-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish ScamRadar Next APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ScamRadar-Next.apk
          if ! gh release view apk-next >/dev/null 2>&1; then
            gh release create apk-next \
              --title "ScamRadar Next APK" \
              --notes "Test build of ScamRadar Next." \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
          gh release edit apk-next \
            --notes "Test build #${{ github.run_number }} — commit ${GITHUB_SHA::7}"
          gh release upload apk-next ScamRadar-Next.apk --clobber

